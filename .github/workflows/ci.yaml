name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      version:
        description: Validated release version
        value: ${{ jobs.build-native.outputs.version }}
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  lint-go:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: make go-lint
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
  lint-frontend:
    name: Frontend lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make frontend-lint
  lint-script:
    name: Script and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make shell-check workflow-check
  test-go:
    name: Go race tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: make test
      - run: go run ./cmd/evigo validate --config config.example.yaml
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make frontend-test
  security:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make security-check
  build-native:
    name: Native builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Read release version
        id: version
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: make release
      - name: Validate native release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test "$(./evigo-linux-amd64 version)" = "Evigo $VERSION"
          ./evigo-linux-amd64 validate --config config.example.yaml
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-binaries
          path: |
            dist/*.tar.gz
            dist/install.sh
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
  build-docker:
    name: Docker (${{ matrix.arch }})
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-binaries
          path: dist
      - run: docker build --target test -t evigo:test .
      - name: Build the release candidate
        env:
          VERSION: ${{ needs.build-native.outputs.version }}
        run: |
          docker build --build-arg VERSION="$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t evigo:local .
      - name: Validate image and native archive on this CPU
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.build-native.outputs.version }}
        run: |
          docker compose config --quiet
          test "$(docker run --rm --network none evigo:local version)" = "Evigo $VERSION"
          docker run --rm --network none -v "$PWD/config.example.yaml:/config.yaml:ro" evigo:local validate --config /config.yaml
          tar -xzf "dist/evigo-linux-$ARCH.tar.gz" -C dist
          test "$("dist/evigo-linux-$ARCH" version)" = "Evigo $VERSION"
          "dist/evigo-linux-$ARCH" validate --config config.example.yaml
          docker image inspect evigo:local --format '{{.Id}}' > image-id.txt
          docker save evigo:local | gzip > evigo-image.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-${{ matrix.arch }}
          path: |
            evigo-image.tar.gz
            image-id.txt
          retention-days: 7
          if-no-files-found: error
