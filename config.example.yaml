log:
  level: info
state:
  path: /var/lib/evigo/evigo.db
nut:
  host: nut.example.lan
  port: 3493
  ups: main-ups
  # Omit both fields for anonymous read-only access.
  # username: "${NUT_USERNAME}"
  # password: "${NUT_PASSWORD}"
  # Alternatively use password_file: /run/secrets/nut_password
  connect_timeout: 5s
  read_timeout: 5s
  # Each packet must finish before its reading reaches this age.
  # A gap between checks longer than this restarts the stability delay.
  max_reading_age: 30s
poll:
  interval: 10s
  on_battery_interval: 2s
recovery:
  # Devices still answering ping when this delay ends are left as they are, so
  # set it longer than a shutdown takes to finish after mains returns.
  stable_power_delay: 30s
  min_battery_percent: 25
  retry_interval: 30s
  # Counts only while waking is allowed.
  device_timeout: 10m
probe:
  timeout: 2s
wol:
  broadcast: 255.255.255.255
  port: 9
web:
  # Leave empty to turn off the dashboard and API.
  # It has no login: keep it on loopback or behind a reverse proxy that adds one.
  listen: ''
  # listen: 127.0.0.1:8080
  # Hostnames the dashboard is reached by, for example through a reverse proxy,
  # without a port. IP addresses and localhost are always accepted.
  # allowed_hosts: [evigo.example.lan]
alerts:
  # Leave host empty to turn off email alerts.
  email:
    host: ''
    # host: smtp.example.lan
    # starttls usually uses port 587, tls usually 465. none is for a trusted relay.
    # port: 587
    # security: starttls
    # Omit both fields if the server needs no login.
    # username: "${SMTP_USERNAME}"
    # password: "${SMTP_PASSWORD}"
    # Alternatively use password_file: /run/secrets/smtp_password
    # from: evigo@example.lan
    # to: [admin@example.lan]
  # Leave webhook_url empty to turn off Discord alerts.
  discord:
    webhook_url: ''
    # webhook_url: "${DISCORD_WEBHOOK_URL}"
  # Leave topic empty to turn off ntfy alerts.
  ntfy:
    topic: ''
    # topic: "${NTFY_TOPIC}"
    # Your own ntfy server, if you host one.
    # url: https://ntfy.sh
    # Access token for a protected topic.
    # token: "${NTFY_TOKEN}"
  # Leave url empty to turn off webhook alerts.
  webhook:
    url: ''
    # url: "${WEBHOOK_URL}"
devices:
  - id: server
    name: Home server
    host: 192.0.2.10
    mac: '02:00:00:00:00:10'
    # Set a directed broadcast if required.
    # wol:
    #   broadcast: 192.0.2.255
    #   port: 9
  - id: storage
    name: Storage server
    host: 192.0.2.11
    mac: '02:00:00:00:00:11'
