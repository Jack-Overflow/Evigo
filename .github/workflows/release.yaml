name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'Jack-Overflow/Evigo'
    uses: ./.github/workflows/ci.yaml
  publish:
    name: Publish verified release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
      IMAGE: ghcr.io/jack-overflow/evigo
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-binaries
          path: dist
      - name: Prepare draft release and verified downloads
        env:
          COMMIT: ${{ github.sha }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          tag="v$VERSION"
          awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          if gh release view "$tag" --json isDraft,targetCommitish > release.json 2>/dev/null; then
            jq -e --arg commit "$COMMIT" '.isDraft and .targetCommitish == $commit' release.json
          else
            existing_tag=$(git ls-remote --tags origin "refs/tags/$tag")
            test -z "$existing_tag"
            gh release create "$tag" --target "$COMMIT" --title "Evigo $tag" --draft --notes-file release-notes.md
          fi
          gh release upload "$tag" dist/*.tar.gz dist/install.sh dist/SHA256SUMS --clobber
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Release image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }},enable=${{ !startsWith(env.VERSION, '0.') }}
            type=raw,value=latest
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: docker-*
          path: images
      - name: Publish the verified images without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            directory="images/docker-$arch"
            docker load --input "$directory/evigo-image.tar.gz"
            actual=$(docker image inspect evigo:local --format '{{.Id}}')
            test "$actual" = "$(cat "$directory/image-id.txt")"
            test "$(docker image inspect evigo:local --format '{{.Architecture}}')" = "$arch"
            candidate="$IMAGE:verified-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag evigo:local "$candidate"
            docker push "$candidate"
            digest=$(docker image inspect "$candidate" --format '{{json .RepoDigests}}' |
              jq -er --arg prefix "$IMAGE@" '[.[] | select(startswith($prefix))] | if length == 1 then .[0] else error("ambiguous image digest") end')
            sources+=("$digest")
          done
          tags=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Publish release after downloads and image are ready
        run: gh release edit "v$VERSION" --draft=false --latest
